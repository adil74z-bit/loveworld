name: Firebase security rules tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [security/free-firebase-mvp]
jobs:
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx firebase-tools emulators:exec --only database --project demo-loveworld-security "npm test"
